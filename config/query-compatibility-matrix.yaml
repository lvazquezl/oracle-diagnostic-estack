  Q-DISC-INSTANCE-001: {file: queries/oracle/discovery/Q-DISC-INSTANCE-001.md, variants: implicit_full_range, min: "10.2", max: latest, required_views: [V$INSTANCE, GV$INSTANCE], role_scope: ANY, cost_class: LOW, validation_status: COMPATIBLE}
