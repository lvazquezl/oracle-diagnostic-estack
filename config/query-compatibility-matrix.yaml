# Query Compatibility Matrix — Oracle Core Compatibility Hardening
#
# Fuente estructurada por logical query: variantes, rango de versión real, vistas/columnas
# requeridas, container/role scope, cost class, validation_status. Espejo ejecutable de lo
# declarado en cada archivo queries/**/Q-*.md — ver tests/test_every_logical_query_has_variant.sh
# y tests/test_documented_support_matches_query_variants.sh para la validación cruzada.
#
# validation_status: COMPATIBLE | VARIANT_REQUIRED (ya corregido en este hardening) |
#                     UNSUPPORTED | INCORRECT_VERSION_RANGE | INCORRECT_COST_CLASS |
#                     INCORRECT_CONTAINER_SCOPE | INCORRECT_ROLE_SCOPE
# Todas las entradas de este archivo están post-corrección: status COMPATIBLE salvo que se
# indique lo contrario explícitamente (ninguna en este catálogo queda con hallazgo abierto).

schema_version: 1

queries:
  # --- Queries con variantes explícitas (corregidas en este hardening) ---

  Q-DISC-IDENTITY-001:
    file: queries/oracle/discovery/Q-DISC-IDENTITY-001.md
    variants:
      - {variant_id: Q-DISC-IDENTITY-001-V1, label: legacy_10g_11g, min: "10.2", max: "11.2", container_scope: NON_CDB}
      - {variant_id: Q-DISC-IDENTITY-001-V2, label: multitenant_12c, min: "12.1", max: "12.2", container_scope: ANY_CONTAINER}
      - {variant_id: Q-DISC-IDENTITY-001-V3, label: modern_18plus, min: "18.0", max: latest, container_scope: ANY_CONTAINER}
    required_views: [V$INSTANCE, V$DATABASE]
    role_scope: ANY
    cost_class: LOW
    license_requirements: none
    validation_status: COMPATIBLE
    was: VARIANT_REQUIRED   # estado antes de este hardening

  Q-DISC-RAC-001:
    file: queries/oracle/discovery/Q-DISC-RAC-001.md
    variants:
      - {variant_id: Q-DISC-RAC-001-V1, label: pre_multitenant, min: "11.2", max: "11.2", container_scope: NOT_APPLICABLE}
      - {variant_id: Q-DISC-RAC-001-V2, label: multitenant_aware, min: "12.1", max: latest, container_scope: NOT_APPLICABLE}
    required_views: [GV$INSTANCE, V$ACTIVE_INSTANCES]
    role_scope: ANY
    cost_class: LOW
    license_requirements: none
    validation_status: COMPATIBLE
    was: VARIANT_REQUIRED

  Q-ORA-INSTANCE-STATE-001:
    file: queries/oracle/instance/Q-ORA-INSTANCE-STATE-001.md
    variants:
      - {variant_id: Q-ORA-INSTANCE-STATE-001-V1, label: legacy_10g, min: "10.2", max: "10.2", container_scope: NOT_APPLICABLE}
      - {variant_id: Q-ORA-INSTANCE-STATE-001-V2, label: modern_11plus, min: "11.0", max: latest, container_scope: NOT_APPLICABLE}
    required_views: [GV$INSTANCE]
    role_scope: ANY
    cost_class: LOW
    license_requirements: none
    validation_status: COMPATIBLE
    was: VARIANT_REQUIRED

  Q-DBA-TBS-USAGE-001:
    file: queries/oracle/tablespaces/Q-DBA-TBS-USAGE-001.md
    variants:
      - {variant_id: Q-DBA-TBS-USAGE-001-V1, label: legacy_10g, min: "10.2", max: "10.2", container_scope: ANY_CONTAINER}
      - {variant_id: Q-DBA-TBS-USAGE-001-V2, label: modern_11plus, min: "11.0", max: latest, container_scope: ANY_CONTAINER}
    required_views: [DBA_TABLESPACE_USAGE_METRICS, DBA_DATA_FILES, DBA_FREE_SPACE]
    role_scope: ANY
    cost_class: LOW
    license_requirements: none
    validation_status: COMPATIBLE
    was: VARIANT_REQUIRED

  Q-DISC-ASM-001:
    file: queries/oracle/discovery/Q-DISC-ASM-001.md
    variants:
      - {variant_id: Q-DISC-ASM-001-V1, label: routine_stat, min: "11.0", max: latest, container_scope: NOT_APPLICABLE}
      - {variant_id: Q-DISC-ASM-001-V2, label: detailed_diskgroup, min: "11.0", max: latest, container_scope: NOT_APPLICABLE, cost_class: MEDIUM, on_demand_only: true}
    required_views: [V$ASM_DISKGROUP_STAT, V$ASM_DISKGROUP]
    role_scope: ANY
    cost_class: LOW
    license_requirements: none
    validation_status: COMPATIBLE
    was: INCORRECT_COST_CLASS

