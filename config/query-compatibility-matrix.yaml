notes: >
  "implicit_full_range" significa: la query no requirió split porque su SQL, verificado contra
  compatibility/oracle-dictionary/views.yaml, no referencia ninguna columna/vista fuera de su
  supported_oracle_versions declarado. Ver docs/QUERY_VARIANTS.md#logical-query-vs-physical-sql-variant.
