  # --- Fase 5 (Data Guard) ---

  # "max" explicito (nunca "latest") en todo el dominio Data Guard desde PHASE 5 — DATA GUARD
  # COMPATIBILITY & QUERY CERTIFICATION HARDENING (# 10-15 del prompt): "latest" resolvia a un
  # techo sin limite en el Query Variant Resolver (vernum("latest") = 99999), lo que hacia que
  # cualquier version futura desconocida resolviera como compatible por herencia — contradiciendo
  # la propia declaracion UNKNOWN_FUTURE de agents/oracle-dataguard-analyst/manifest.yaml. El techo
  # explicito "23.0" refleja las versiones realmente certificadas (10g-23ai); una version futura
  # (ej. 24.x) ya no hace match y cae correctamente en COMPATIBILITY_VALIDATION_REQUIRED.
