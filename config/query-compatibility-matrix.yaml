  # PHASE 5 — DATA GUARD FINAL PROCESS-VIEW & PORTABILITY HARDENING: rango corregido — V$DATAGUARD_
  # PROCESS fue introducida en 12.2.0.1 (no 11.2, corregido contra Oracle Database Reference), y
  # V$MANAGED_STANDBY esta oficialmente deprecada desde esa misma version. Particion real sin
  # solapamiento (no "legacy default + modern on-demand"): 10.2-12.1 -> legacy exclusivamente,
  # 12.2-23.0 -> modern exclusivamente. Ver docs/PHASE_5_FINAL_PROCESS_VIEW_PORTABILITY_HARDENING.md.
  Q-DG-MANAGED-PROCESS-001:
    file: queries/dataguard/Q-DG-MANAGED-PROCESS-001.md
    variants:
      - {variant_id: Q-DG-MANAGED-PROCESS-001-V1, label: legacy_managed_standby, min: "10.2", max: "12.1", container_scope: ANY_CONTAINER}
      - {variant_id: Q-DG-MANAGED-PROCESS-001-V2, label: modern_dataguard_process, min: "12.2", max: "23.0", container_scope: ANY_CONTAINER}
    required_views: [V$MANAGED_STANDBY, GV$MANAGED_STANDBY, V$DATAGUARD_PROCESS, GV$DATAGUARD_PROCESS]
    role_scope: ANY
    cost_class: LOW
    license_requirements: none
    validation_status: COMPATIBLE
    was: WRONG_MIN_VERSION_AND_WRONG_COLUMNS

notes: >
  "implicit_full_range" significa: la query no requirió split porque su SQL, verificado contra
  compatibility/oracle-dictionary/views.yaml, no referencia ninguna columna/vista fuera de su
  supported_oracle_versions declarado. Ver docs/QUERY_VARIANTS.md#logical-query-vs-physical-sql-variant.
