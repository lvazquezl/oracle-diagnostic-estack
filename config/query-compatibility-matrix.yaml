# Query Compatibility Matrix — Oracle Core Compatibility Hardening
#
# Fuente estructurada por logical query: variantes, rango de versión real, vistas/columnas
# requeridas, container/role scope, cost class, validation_status. Espejo ejecutable de lo
# declarado en cada archivo queries/**/Q-*.md — ver tests/test_every_logical_query_has_variant.sh
# y tests/test_documented_support_matches_query_variants.sh para la validación cruzada.
#
# validation_status: COMPATIBLE | VARIANT_REQUIRED (ya corregido en este hardening) |
#                     UNSUPPORTED | INCORRECT_VERSION_RANGE | INCORRECT_COST_CLASS |
#                     INCORRECT_CONTAINER_SCOPE | INCORRECT_ROLE_SCOPE
# Todas las entradas de este archivo están post-corrección: status COMPATIBLE salvo que se
# indique lo contrario explícitamente (ninguna en este catálogo queda con hallazgo abierto).

schema_version: 1

queries:
  # --- Queries con variantes explícitas (corregidas en este hardening) ---

  Q-DISC-IDENTITY-001:
    file: queries/oracle/discovery/Q-DISC-IDENTITY-001.md
    variants:
      - {variant_id: Q-DISC-IDENTITY-001-V1, label: legacy_10g_11g, min: "10.2", max: "11.2", container_scope: NON_CDB}
      - {variant_id: Q-DISC-IDENTITY-001-V2, label: multitenant_12c, min: "12.1", max: "12.2", container_scope: ANY_CONTAINER}
      - {variant_id: Q-DISC-IDENTITY-001-V3, label: modern_18plus, min: "18.0", max: latest, container_scope: ANY_CONTAINER}
    required_views: [V$INSTANCE, V$DATABASE]
    role_scope: ANY
    cost_class: LOW
    license_requirements: none
    validation_status: COMPATIBLE
    was: VARIANT_REQUIRED   # estado antes de este hardening

