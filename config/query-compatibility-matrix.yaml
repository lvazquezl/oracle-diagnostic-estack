  Q-ORA-UNDO-001: {file: queries/oracle/undo/Q-ORA-UNDO-001.md, variants: implicit_full_range, min: "10.2", max: latest, required_views: [V$PARAMETER, DBA_TABLESPACES, V$UNDOSTAT], role_scope: PRIMARY, cost_class: LOW, validation_status: COMPATIBLE}
