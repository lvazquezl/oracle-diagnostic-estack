# Fuente estructurada de verdad de la Capability Matrix. docs/CAPABILITY_MATRIX.md debe mantenerse
# consistente con este archivo (ver tests/test_capability_matrix_registry_consistency.sh).
#
# status values: PLANNED | FOUNDATION_ONLY | PARTIAL | SUPPORTED | UNSUPPORTED | LICENSE_DEPENDENT
#   PLANNED           — la feature Oracle existe en esa versión, pero el e-stack aún no tiene
#                        contrato/skill/query ni siquiera registrado para ella.
#   FOUNDATION_ONLY   — el dominio tiene agente/contrato/skills REGISTERED, pero ningún skill
#                        materializado (status: active) todavía cubre esta versión.
#   PARTIAL           — al menos un skill materializado cubre esta versión, pero no el dominio completo.
#   SUPPORTED         — cobertura completa certificada (no ocurre aún en Fase 1/Hardening).
#   UNSUPPORTED       — la feature Oracle NO EXISTE en esa versión/arquitectura (no es límite del e-stack).
#   LICENSE_DEPENDENT — depende de licenciamiento adicional (Diagnostics/Tuning Pack, etc.) independientemente
#                        de la cobertura del e-stack; ver policies/licensing-awareness-policy.md.
#
# "latest" trackea la versión mayor soportada más reciente (hoy: 23ai) hasta que se agregue una nueva
# vía /change compatibility.

schema_version: 1
generated_from: "Foundation Hardening pass"
domains:
