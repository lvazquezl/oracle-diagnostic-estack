    notes: "Fase 2: las 18 skills oracle/* completamente materializadas (SKILL.md + manifest.yaml), ~26 queries Q-ORA-*/Q-DISC-*/Q-DBA-* certificadas. Compatibility Hardening (config/query-compatibility-matrix.yaml) validó que cada versión declarada tiene una variante SQL ejecutable real (Query Variant Resolver), no sólo metadata — ver docs/QUERY_VARIANTS.md y docs/PHASE_2_COMPATIBILITY_HARDENING.md. diagnostics (ADR) requiere 11g+; en 10g degrada a UNSUPPORTED para ese sub-componente específico. jobs/DBA_JOBS (legacy DBMS_JOB) es un gap documentado y PLANNED en todas las versiones — el sub-componente DBMS_SCHEDULER (Q-ORA-JOBS-SUMMARY-001) sí está SUPPORTED 10g–23ai; ver skills/oracle/jobs/SKILL.md. El resto de Oracle Core aplica igual en todas las versiones declaradas."

