    future_status: COMPATIBILITY_VALIDATION_REQUIRED
    notes: "Fase 6: 26 skills multitenant/* completamente materializados (architecture, cdb-discovery, pdb-inventory, pdb-state, pdb-open-mode, pdb-services, pdb-rac-placement, pdb-sessions, pdb-tablespaces, pdb-temp, pdb-undo, local-undo, parameters, common-local-users, common-local-roles, components, plugin-violations, resource-usage, resource-manager, lockdown-profiles, application-containers, proxy-pdb, configuration-drift, healthcheck, assessment, troubleshooting), 15 queries Q-CDB-*/Q-CDB-PDB-* certificadas -> SUPPORTED 12.1-23ai para NON-CDB awareness, CDB discovery/root, PDB inventory/state/open-mode/services/RAC placement/sesiones/storage/temp/undo, parameter scope y drift, common/local identity (visibilidad), component health, plug-in violations, resource usage/manager (visibilidad), lockdown profiles (visibilidad), configuration drift. Local Undo NO existe en 12.1 (introducido en 12.2) -- degradado correctamente vía Query Variant Contract, nunca asumido. Application Containers / Proxy PDB (12.2+) son PARTIALLY_SUPPORTED (topología vía V\$PDBS, sin profundidad de lifecycle) -- ver agents/oracle-multitenant-analyst/manifest.yaml#supported_container_modes. Multitenant no existe antes de 12c -> UNSUPPORTED real (no límite del e-stack); en NON-CDB (cualquier versión) MULTITENANT_STATUS: NOT_APPLICABLE se publica directamente desde el Target Profile, sin activar el agente. Más de 1 PDB por CDB es LICENSE_DEPENDENT según edición (ver policies/licensing-awareness-policy.md) -- señalado por finding específico, no a nivel de dominio completo. CONTAINER DETECTION básica sigue SUPPORTED desde Fase 2 vía el Target Profile. El campo 'latest: SUPPORTED' fue eliminado de esta fila (mismo criterio que Data Guard Fase 5) -- una major Oracle nueva requiere /change compatibility antes de avanzar 'future_status' a SUPPORTED. Ninguna ejecución de ALTER PLUGGABLE DATABASE / CREATE-DROP-CLONE-UNPLUG-PLUG / SAVE STATE / cambio de parámetro / Resource Manager / lockdown profile / usuario común o local -- sólo visibilidad y diagnóstico. PHASE 6 — QUERY COMPATIBILITY & DICTIONARY CERTIFICATION HARDENING (sub-capacidades con precisión de versión distinta del agregado 12.1-23ai de la fila): PDB Saved State -> SUPPORTED desde 12.1.0.2 (patch level, no 12.1 genérico -- no existe en 12.1.0.0/12.1.0.1, vista real DBA_PDB_SAVED_STATES, no CDB_PDB_SAVED_STATES que no existe). PDB Resource Metrics -> 12.1: PARTIALLY_SUPPORTED (V\$RSRCPDBMETRIC no existe, introducida en 12.2.0.1, sin fuente alternativa certificada), 12.2+: SUPPORTED. Plug-in Violations -> SUPPORTED con variantes version-specific (12.1: sin CON_ID, container_id NOT_AVAILABLE; 12.2+: con CON_ID). Ninguna se marca con soporte superior al realmente certificado."

