      - {owner: "PDB1_APP", object_type: "PACKAGE BODY", object_name: "PKG_TOKEN_001", category: "APPLICATION"}

expected_findings:
  - category: components
    severity: HIGH
    reason: "componente XDB en estado INVALID"
  - category: invalid-objects
    severity: MEDIUM
    reason: "objeto inválido en schema de aplicación"
