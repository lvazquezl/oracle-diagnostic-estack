# Fixture: pam_limits.so activo sin conf= -- mode debe ser DEFAULT, con awareness de
# limits.conf/limits.d según la plataforma certificada.
# Usada por: os/systemd-limits, os/ulimits.
fixture_id: FX-OS-ol8-pam-default-policy-source

os_target:
  family: linux
  distribution: "Oracle Linux"
  version: "8.9"
  kernel: "5.15.0-200.131.31.el8uek.x86_64"
  architecture: x86_64
  virtualization: "bare_metal"
  hostname_token: "HOST_TOKEN_130"

mock_evidence:
  - collector_id: get_pam_limits_applicability
    result: {service: "oracle", pam_limits_module_present: true, stack_readable: true}
  - collector_id: get_pam_limits_policy_source
    result:
      service: "oracle"
      invocations:
        - module: "pam_limits.so"
          arguments: {}
          mode: DEFAULT

expected_findings:
  - category: systemd-limits
    mode: DEFAULT
    limits_d_enabled: true
    reason: "session required pam_limits.so sin conf= -- la fuente efectiva es /etc/security/limits.conf y limits.d según la plataforma certificada"
