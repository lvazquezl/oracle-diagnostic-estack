  - query_id: Q-ORA-JOBS-SUMMARY-001
    result:
      - {owner: "APP", job_name: "NIGHTLY_STATS", state: "FAILED", failure_count: 3}
  - query_id: Q-ORA-DIAGNOSTICS-ADR-001
    result:
      - {reason: "ORA-4031", message_type: "Error", creation_time: "2026-01-15T03:00:00Z"}

expected_findings:
