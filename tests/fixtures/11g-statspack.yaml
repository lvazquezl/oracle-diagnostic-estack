# Fixture: Oracle 11g Standalone — Statspack (sin Diagnostics Pack)
# Usada por: test_statspack_11g.sh
fixture_id: FX-11g-statspack

target_profile:
  schema_version: "2.0.0"
  target_id: "fixture-11g-statspack"
  database:
    name: "ORCL11G"
    unique_name: "ORCL11G"
    dbid: "9334567890"
  oracle_version: {major: 11, minor: 2, release: 0, ru: null, raw: "11.2.0.4.0"}
  architecture: {cluster_mode: standalone, multitenant_mode: non_cdb, storage_mode: filesystem}
  database_role: primary
  open_mode: "READ WRITE"
  log_mode: archivelog
  force_logging: false
  instance: {name: "orcl11g", number: 1, host: "HOST_TOKEN_021"}
  cluster: {detected: false, instance_count: 1}
  container: {type: non_cdb, con_id: null, con_name: null}
  platform: {database_platform: "Linux x86 64-bit"}
  capabilities:
    rac: UNSUPPORTED
    asm: PARTIAL
    multitenant: UNSUPPORTED
    dataguard: UNSUPPORTED
    awr: LICENSE_RESTRICTED
    ash: LICENSE_RESTRICTED
  discovery: {timestamp: "2026-01-16T09:05:00Z", evidence_refs: [EVD-FX-021], confidence: FACT}

license_confirmed: {diagnostics_pack: false, tuning_pack: false}
statspack_installed: true

compatibility_schema:
  available_views: [V$INSTANCE, GV$INSTANCE, V$DATABASE, V$PARAMETER, GV$PARAMETER, V$SPPARAMETER,
    V$SESSION, GV$SESSION, V$PROCESS, V$RESOURCE_LIMIT, STATS$SYSTEM_EVENT, STATS$SNAPSHOT,
    V$SYS_TIME_MODEL, V$SQLSTATS, V$SQL_PLAN, V$SGA, V$SGAINFO, V$SGASTAT, V$PGASTAT, V$SYSSTAT,
    V$LIBRARYCACHE, V$ROWCACHE, V$SYSTEM_EVENT, V$FILESTAT, V$DATAFILE, V$SORT_USAGE, V$LOCK,
    V$PX_SESSION]
    # DBA_HIST_*/V$ACTIVE_SESSION_HISTORY no listadas: diagnostics_pack: false (AWR/ASH no aplican).
  available_columns:
    "V$INSTANCE.version_full": false     # 18.0+
    "V$INSTANCE.instance_role": true     # 11.0+
    "V$DATABASE.cdb": false              # 12.1+, arquitectura non_cdb de todos modos
    "V$ACTIVE_INSTANCES.con_id": false
    "V$SESSION.con_id": false            # 12.1+
    "DBA_HIST_SYSTEM_EVENT.time_waited_micro_fg": false   # AWR no aplica aquí (sin Diagnostics Pack)

mock_evidence:
  - query_id: Q-PERF-WAIT-STATSPACK-001
    result:
      - {instance_number: 1, event_name: "latch free", wait_class_derived: "Concurrency", total_wait_time_sec: 610.0}
      - {instance_number: 1, event_name: "db file scattered read", wait_class_derived: "User I/O", total_wait_time_sec: 200.0}
  - query_id: Q-PERF-DBTIME-CURRENT-001
    result:
      db_time_sec_since_startup: 5400.0
      db_cpu_sec_since_startup: 3200.0
      uptime_sec: 864000.0

expected_findings:
  - category: statspack-analysis
    severity: MEDIUM
    confidence: HYPOTHESIS
    reason: "top wait 'latch free' (Concurrency, wait_class_derived aproximado) — correlacionar con performance/concurrency antes de escalar severidad"
