# Fixture: storage con crecimiento lineal + un outlier transitorio (job de export temporal) —
# dataset sintético de validación para robustness del forecast (detect/flag/compare, nunca
# eliminación silenciosa).
# Usada por: capacity/forecasting (robustness), capacity/anomaly-awareness, capacity/data-quality.
# Sin datos productivos — serie sintética (# 70, # 881-897 del prompt de Fase 10).
fixture_id: FX-CAP-outliers-storage

capacity_target:
  resource_type: filesystem
  technology: linux
  target_id: TARGET_TOKEN_705
  unit: GiB

mock_series:
  aggregation: daily
  samples: 60
  total_capacity_gib: 500
  used_capacity_gib_start: 200
  growth_per_day_gib: 1.0
  outlier_at_sample: 30
  outlier_used_capacity_gib: 420
  outlier_reverts_next_sample: true
  description: "crecimiento lineal ~1 GiB/día con un pico transitorio aislado en el día 30 (export temporal a /backup local, revertido al día siguiente)."

expected:
  outlier_detected: true
  outlier_flagged: true
  outlier_silently_removed: false
  excluded_samples_recorded_if_excluded: true
  trend_classification: INCREASING
  data_quality_status: ACCEPTABLE
  confidence: MEDIUM
