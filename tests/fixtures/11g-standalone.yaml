    ash: LICENSE_RESTRICTED
  discovery: {timestamp: "2026-01-15T09:05:00Z", evidence_refs: [EVD-FX-002], confidence: FACT}

compatibility_schema:
  available_views: [V$INSTANCE, GV$INSTANCE, V$DATABASE, V$PARAMETER, GV$PARAMETER, V$SPPARAMETER,
    V$CONTROLFILE, V$CONTROLFILE_RECORD_SECTION, V$LOG, V$LOGFILE, V$LOG_HISTORY, V$ARCHIVE_DEST,
