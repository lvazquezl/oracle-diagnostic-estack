    DBA_OBJECTS, DBA_REGISTRY, DBA_SCHEDULER_JOBS, DBA_SCHEDULER_JOB_RUN_DETAILS, DBA_JOBS,
    V$DIAG_INFO, DBA_OUTSTANDING_ALERTS, V$ACTIVE_SESSION_HISTORY, DBA_HIST_SNAPSHOT,
