# Fixture: la pila PAM contiene dos invocaciones de pam_limits.so -- una DEFAULT y otra
# CUSTOM_CONF -- deben representarse como dos registros de policy-source separados, nunca
# colapsados.
# Usada por: os/systemd-limits.
fixture_id: FX-OS-ol8-pam-limits-multiple-invocations

os_target:
  family: linux
  distribution: "Oracle Linux"
  version: "8.9"
  kernel: "5.15.0-200.131.31.el8uek.x86_64"
  architecture: x86_64
  virtualization: "bare_metal"
  hostname_token: "HOST_TOKEN_132"

mock_evidence:
  - collector_id: get_pam_limits_applicability
    result: {service: "oracle", pam_limits_module_present: true, stack_readable: true}
  - collector_id: get_pam_limits_policy_source
    result:
      service: "oracle"
      invocations:
        - module: "pam_limits.so"
          arguments: {}
          mode: DEFAULT
        - module: "pam_limits.so"
          arguments: {conf: "/custom/path"}
          mode: CUSTOM_CONF
          source_token: "SOURCE_TOKEN_CUSTOM_002"

expected_findings:
  - category: systemd-limits
    policy_sources_count: 2
    collapsed: false
    reason: "dos invocaciones de pam_limits.so con argumentos distintos se representan como dos registros policy_sources[] separados, nunca fusionados en uno"
