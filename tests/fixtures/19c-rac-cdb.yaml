# Fixture: Oracle 19c RAC CDB (3 nodos)
# Usada por: test_19c_rac_detection.sh, test_oracle_core_instance.sh, test_oracle_core_parameters.sh,
#            test_oracle_core_sessions.sh, test_oracle_core_processes.sh, test_oracle_core_resource_limits.sh
fixture_id: FX-19c-rac-cdb

target_profile:
  schema_version: "2.0.0"
  target_id: "fixture-19c-rac"
  database:
    name: "CDB19CRAC"
    unique_name: "CDB19CRAC"
    dbid: "6234567890"
  oracle_version: {major: 19, minor: 0, release: 0, ru: "19.21", raw: "19.21.0.0.0"}
  architecture: {cluster_mode: rac, multitenant_mode: cdb, storage_mode: asm}
  database_role: primary
  open_mode: "READ WRITE"
  log_mode: archivelog
  force_logging: true
  instance: {name: "cdb19crac1", number: 1, host: "HOST_TOKEN_015A"}
  cluster: {detected: true, instance_count: 3}
  container: {type: cdb_root, con_id: 1, con_name: "CDB$ROOT"}
  platform: {database_platform: "Linux x86 64-bit"}
  capabilities:
    rac: SUPPORTED
    asm: SUPPORTED
    multitenant: SUPPORTED
    dataguard: UNSUPPORTED
    awr: LICENSE_RESTRICTED
    ash: LICENSE_RESTRICTED
  pdbs: ["SALESPDB", "HRPDB"]
  discovery: {timestamp: "2026-01-15T09:25:00Z", evidence_refs: [EVD-FX-006], confidence: FACT}

compatibility_schema:
  available_views: [V$INSTANCE, GV$INSTANCE, V$DATABASE, V$ACTIVE_INSTANCES, V$PARAMETER,
    GV$PARAMETER, V$SPPARAMETER, V$CONTROLFILE, V$CONTROLFILE_RECORD_SECTION, V$LOG, V$LOGFILE,
    V$LOG_HISTORY, V$ARCHIVE_DEST, V$ARCHIVE_DEST_STATUS, V$ARCHIVED_LOG, DBA_TABLESPACES,
    DBA_DATA_FILES, DBA_FREE_SPACE, DBA_TABLESPACE_USAGE_METRICS, DBA_TEMP_FILES,
    DBA_TEMP_FREE_SPACE, V$TEMP_SPACE_HEADER, V$UNDOSTAT, DBA_UNDO_EXTENTS, V$SESSION, GV$SESSION,
    GV$SERVICES, V$PROCESS, V$RESOURCE_LIMIT, DBA_OBJECTS, CDB_OBJECTS, DBA_REGISTRY, CDB_REGISTRY,
    DBA_SCHEDULER_JOBS, DBA_SCHEDULER_JOB_RUN_DETAILS, DBA_JOBS, V$DIAG_INFO,
    DBA_OUTSTANDING_ALERTS, V$ACTIVE_SESSION_HISTORY, DBA_HIST_SNAPSHOT, DBA_HIST_SYSTEM_EVENT,
    DBA_HIST_ACTIVE_SESS_HISTORY, V$ASM_DISKGROUP, V$ASM_DISKGROUP_STAT]
  available_columns:
    "V$INSTANCE.version_full": true      # 18.0+
    "V$INSTANCE.instance_role": true     # 11.0+
    "V$DATABASE.cdb": true                # 12.1+
    "V$ACTIVE_INSTANCES.con_id": true     # 12.1+
    "V$SESSION.con_id": true              # 12.1+
    "DBA_HIST_SYSTEM_EVENT.time_waited_micro_fg": true    # 11.0+

mock_evidence:
  - query_id: Q-ORA-INSTANCE-STATE-001
    result:
      - {inst_id: 1, status: "OPEN", database_status: "ACTIVE"}
      - {inst_id: 2, status: "OPEN", database_status: "ACTIVE"}
      - {inst_id: 3, status: "MOUNTED", database_status: "ACTIVE"}
  - query_id: Q-ORA-PARAMETERS-RAC-DIFF-001
    result:
      - {name: "optimizer_index_cost_adj", distinct_values: 2, instance_count: 3}
  - query_id: Q-ORA-SESSIONS-SUMMARY-001
    result:
      - {status: "ACTIVE", type: "USER", session_count: 180, blocked_count: 0}
  - query_id: Q-ORA-RESOURCE-LIMITS-001
    result:
      - {resource_name: "processes", current_utilization: 380, max_utilization: 495, limit_value: 500}

expected_findings:
  - category: instance
    severity: HIGH
    reason: "instancia 3 en MOUNTED, se esperaba OPEN"
  - category: parameters
    severity: MEDIUM
    reason: "optimizer_index_cost_adj divergente entre instancias"
  - category: resource-limits
    severity: HIGH
    reason: "max_utilization/limit_value >= 90% para processes"
