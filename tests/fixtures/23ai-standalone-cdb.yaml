# Fixture: Oracle 23ai Standalone CDB
# Usada por: test_23ai_version_normalization.sh
fixture_id: FX-23ai-standalone-cdb

target_profile:
  schema_version: "2.0.0"
  target_id: "fixture-23ai-standalone"
  database:
    name: "CDB23AI"
    unique_name: "CDB23AI"
    dbid: "8234567890"
  oracle_version: {major: 23, minor: 4, release: 0, ru: null, raw: "23.4.0.24.05"}
  architecture: {cluster_mode: standalone, multitenant_mode: cdb, storage_mode: filesystem}
  database_role: primary
  open_mode: "READ WRITE"
  log_mode: archivelog
  force_logging: false
  instance: {name: "cdb23ai", number: 1, host: "HOST_TOKEN_018"}
  cluster: {detected: false, instance_count: 1}
  container: {type: cdb_root, con_id: 1, con_name: "CDB$ROOT"}
  platform: {database_platform: "Linux x86 64-bit"}
  capabilities:
    rac: UNSUPPORTED
    asm: UNSUPPORTED
    multitenant: SUPPORTED
    dataguard: UNSUPPORTED
    awr: LICENSE_RESTRICTED
    ash: LICENSE_RESTRICTED
  pdbs: ["APPPDB"]
  discovery: {timestamp: "2026-01-15T09:40:00Z", evidence_refs: [EVD-FX-009], confidence: FACT}

compatibility_schema:
  available_views: [V$INSTANCE, GV$INSTANCE, V$DATABASE, V$ACTIVE_INSTANCES, V$PARAMETER,
    GV$PARAMETER, V$SPPARAMETER, V$CONTROLFILE, V$CONTROLFILE_RECORD_SECTION, V$LOG, V$LOGFILE,
    V$LOG_HISTORY, V$ARCHIVE_DEST, V$ARCHIVE_DEST_STATUS, V$ARCHIVED_LOG, DBA_TABLESPACES,
    DBA_DATA_FILES, DBA_FREE_SPACE, DBA_TABLESPACE_USAGE_METRICS, DBA_TEMP_FILES,
    DBA_TEMP_FREE_SPACE, V$TEMP_SPACE_HEADER, V$UNDOSTAT, DBA_UNDO_EXTENTS, V$SESSION, GV$SESSION,
    GV$SERVICES, V$PROCESS, V$RESOURCE_LIMIT, DBA_OBJECTS, CDB_OBJECTS, DBA_REGISTRY, CDB_REGISTRY,
    DBA_SCHEDULER_JOBS, DBA_SCHEDULER_JOB_RUN_DETAILS, DBA_JOBS, V$DIAG_INFO,
    DBA_OUTSTANDING_ALERTS, V$ACTIVE_SESSION_HISTORY, DBA_HIST_SNAPSHOT, DBA_HIST_SYSTEM_EVENT,
    DBA_HIST_ACTIVE_SESS_HISTORY]
    # V$ASM_DISKGROUP/_STAT no listadas: storage_mode filesystem, no ASM.
    # 23ai clasifica como known_supported hoy (docs/QUERY_VARIANTS.md#future-proof-version-policy);
    # una hipotética 24ai/25ai NO heredaría este bloque automáticamente por ser "más nueva" —
    # entraría como unknown_future hasta /change compatibility.
  available_columns:
    "V$INSTANCE.version_full": true      # 18.0+
    "V$INSTANCE.instance_role": true     # 11.0+
    "V$DATABASE.cdb": true                # 12.1+
    "V$ACTIVE_INSTANCES.con_id": true     # 12.1+
    "V$SESSION.con_id": true              # 12.1+
    "DBA_HIST_SYSTEM_EVENT.time_waited_micro_fg": true    # 11.0+

# Propósito principal de esta fixture: validar que la normalización de version NO compara
# strings ("23.4.0.24.05" no es mayor que "9.21..." como string, pero SI lo es como tupla
# (major=23) > (major=19)) -- ver policies/version-awareness-policy.md.
normalization_assertions:
  - raw: "23.4.0.24.05"
    expected_major: 23
    expected_minor: 4
    expected_label: "23ai"
  - raw: "19.21.0.0.0"
    expected_major: 19
    expected_minor: 0
    expected_ru: "19.21"
    expected_label: "19c"

expected_findings: []
