# Fixture: Oracle 19c Physical Standby
# Usada por: test_19c_standby_detection.sh, test_oracle_core_database_state.sh, test_oracle_core_archive.sh
fixture_id: FX-19c-physical-standby

target_profile:
  schema_version: "2.0.0"
  target_id: "fixture-19c-standby"
  database:
    name: "CDB19C"
    unique_name: "CDB19C_STBY"
    dbid: "5234567890"   # mismo DBID que el primary (19c-standalone-cdb.yaml) — es el mismo par físico
  oracle_version: {major: 19, minor: 0, release: 0, ru: "19.21", raw: "19.21.0.0.0"}
  architecture: {cluster_mode: standalone, multitenant_mode: cdb, storage_mode: filesystem}
  database_role: physical_standby
  open_mode: "MOUNTED"
  log_mode: archivelog
  force_logging: true
  instance: {name: "cdb19c_stby", number: 1, host: "HOST_TOKEN_016"}
  cluster: {detected: false, instance_count: 1}
  container: {type: cdb_root, con_id: 1, con_name: "CDB$ROOT"}
  platform: {database_platform: "Linux x86 64-bit"}
  capabilities:
    rac: UNSUPPORTED
    asm: UNSUPPORTED
    multitenant: SUPPORTED
    dataguard: SUPPORTED
    awr: LICENSE_RESTRICTED
    ash: LICENSE_RESTRICTED
  discovery: {timestamp: "2026-01-15T09:30:00Z", evidence_refs: [EVD-FX-007], confidence: FACT}

compatibility_schema:
  available_views: [V$INSTANCE, GV$INSTANCE, V$DATABASE, V$ACTIVE_INSTANCES, V$PARAMETER,
    GV$PARAMETER, V$SPPARAMETER, V$CONTROLFILE, V$CONTROLFILE_RECORD_SECTION, V$LOG, V$LOGFILE,
    V$LOG_HISTORY, V$ARCHIVE_DEST, V$ARCHIVE_DEST_STATUS, V$ARCHIVED_LOG, DBA_TABLESPACES,
    DBA_DATA_FILES, DBA_FREE_SPACE, DBA_TABLESPACE_USAGE_METRICS, DBA_TEMP_FILES,
    DBA_TEMP_FREE_SPACE, V$TEMP_SPACE_HEADER, V$UNDOSTAT, DBA_UNDO_EXTENTS, V$SESSION, GV$SESSION,
    GV$SERVICES, V$PROCESS, V$RESOURCE_LIMIT, DBA_OBJECTS, CDB_OBJECTS, DBA_REGISTRY, CDB_REGISTRY,
    DBA_SCHEDULER_JOBS, DBA_SCHEDULER_JOB_RUN_DETAILS, DBA_JOBS, V$DIAG_INFO,
    DBA_OUTSTANDING_ALERTS, V$ACTIVE_SESSION_HISTORY, DBA_HIST_SNAPSHOT, DBA_HIST_SYSTEM_EVENT,
    DBA_HIST_ACTIVE_SESS_HISTORY]
    # View availability por versión no cambia por database_role — pero database_role_scope: PRIMARY
    # bloquea igual la selección de variante para queries como Q-ORA-ARCHIVE-001/Q-ORA-REDO-001
    # sobre este target (ver database_role_scope en cada query), independientemente de que la vista
    # exista. Q-ORA-DB-STATE-001 es database_role_scope: ANY -> sí resuelve aquí.
  available_columns:
    "V$INSTANCE.version_full": true      # 18.0+
    "V$INSTANCE.instance_role": true     # 11.0+
    "V$DATABASE.cdb": true                # 12.1+
    "V$ACTIVE_INSTANCES.con_id": true     # 12.1+
    "V$SESSION.con_id": true              # 12.1+
    "DBA_HIST_SYSTEM_EVENT.time_waited_micro_fg": true    # 11.0+

mock_evidence:
  - query_id: Q-ORA-DB-STATE-001
    result:
      flashback_on: "YES"
      guard_status: "ALL"
      protection_mode: "MAXIMUM PERFORMANCE"
      switchover_status: "NOT ALLOWED"
  - query_id: Q-ORA-ARCHIVE-001
    result:
      - {dest_id: 1, destination: "HOST_TOKEN_016_LOCAL", status: "VALID"}

expected_findings:
  - category: tablespaces
    confidence: UNDETERMINED
    reason: "DBA_FREE_SPACE puede no ser representativa en mount"
