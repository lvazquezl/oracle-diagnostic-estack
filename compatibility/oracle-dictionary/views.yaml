# Oracle Dictionary Compatibility Layer — Fase 2 Compatibility Hardening
#
# NO modela todo el diccionario Oracle. Registra únicamente las vistas/columnas
# efectivamente usadas por el catálogo Oracle Core (queries/oracle/**), para permitir
# tests estáticos (tests/test_sql_static_validator.sh) que verifiquen que ninguna
# variante SQL certificada usa una columna fuera de la versión donde existe.
#
# min_version usa la representación normalizada de policies/version-awareness-policy.md
# (comparar como tupla major.minor, nunca como string). "all" = disponible desde 10g
# (el mínimo soportado por el catálogo) sin restricción adicional conocida.
#
# columns_exhaustive: true (PHASE 5 — DATA GUARD COMPATIBILITY & QUERY CERTIFICATION HARDENING,
# # 7-9 del prompt) marca que el bloque `columns:` de esa vista es una lista COMPLETA de las
# columnas que el catálogo certificado puede seleccionar de ella — no sólo el subconjunto
# histórico usado para el chequeo de version-gating. SÓLO en vistas marcadas así,
# tests/test_sql_static_validator.sh valida EXISTENCIA de columna (además del version-gating).
# Vistas con `columns:` pero SIN este flag (ej. la mayoría de las registradas antes de Fase 5)
# se tratan igual que una vista sin `columns:` en absoluto para ese chequeo — permisivas por
# diseño, porque su lista nunca pretendió ser exhaustiva (ver bug real encontrado en V$ASM_DISK:
# GROUP_NUMBER/DISK_NUMBER/NAME son columnas reales usadas por Q-ASM-DISKS-001 pero no estaban
# registradas, porque esa entrada sólo listaba las columnas relevantes al chequeo de Fase 4).
#
# PATCH-LEVEL min_version (introducido en PHASE 6 — MULTITENANT QUERY COMPATIBILITY & DICTIONARY
# CERTIFICATION HARDENING): normalmente min_version es major.minor ("12.1", "18.0"). Una feature
# cuya disponibilidad real depende del patch level dentro de una misma minor release usa una
# tercera componente explícita ("12.1.0.2") — único caso hoy: DBA_PDB_SAVED_STATES (PDB Saved
# State no existe en 12.1.0.0/12.1.0.1, introducida en 12.1.0.2). El Query Variant Resolver
# compartido (scripts/lib/version.sh — normalize_oracle_version/compare_oracle_versions/
# version_gte/version_lte/version_in_range) es patch-level-aware y es la ÚNICA implementación de
# comparación de versión permitida en todo el repositorio (Query Variant Resolver, Static
# Validator, compatibility tests) — ver PHASE 6 — VERSION RESOLVER CONSOLIDATION FINALIZATION,
# docs/PHASE_6_FINAL_PDB_IDENTITY_PATCH_RESOLVER_HARDENING.md. Ningún test reimplementa esta
# comparación localmente (enforcement: tests/test_no_local_version_resolvers_in_tests.sh).

schema_version: 1

views:
  V$INSTANCE:
    min_version: all
    columns:
      version:            {min_version: all}
      version_full:        {min_version: "18.0"}      # BUG CORREGIDO: usado sin guardia en Q-DISC-IDENTITY-001 v1.0
      instance_name:       {min_version: all}
      instance_number:      {min_version: all}
      host_name:            {min_version: all}
      status:                {min_version: all}
      database_status:       {min_version: all}
      active_state:            {min_version: all}
      shutdown_pending:         {min_version: all}
      startup_time:              {min_version: all}
      instance_role:              {min_version: "11.0"}  # BUG CORREGIDO: usado sin guardia en Q-ORA-INSTANCE-STATE-001 v1.0

  GV$INSTANCE:
    min_version: all
    notes: "Mismas columnas que V$INSTANCE, una fila por instancia visible."

  V$DATABASE:
    min_version: all
    columns_exhaustive: true
    columns:
      name:                {min_version: all}
      database_role:         {min_version: all}
      db_unique_name:         {min_version: all}   # Fase 5 Compatibility Hardening: registrada, usada por Q-DG-ROLE-001
      open_mode:              {min_version: all}
      log_mode:                {min_version: all}
      force_logging:            {min_version: all}
      cdb:                       {min_version: "12.1"}   # BUG CORREGIDO: usado sin guardia en Q-DISC-IDENTITY-001 v1.0
      flashback_on:              {min_version: all}
      guard_status:               {min_version: all}
      protection_mode:             {min_version: all}
      protection_level:             {min_version: all}
      remote_archive:                 {min_version: all}
      switchover_status:                {min_version: all}
      # NOTA (Fase 5 Compatibility Hardening): LOG_ARCHIVE_CONFIG NO es columna de V$DATABASE.
      # Es un parametro de inicializacion (V$PARAMETER) — bug de certificacion detectado y corregido
      # en Q-DG-ROLE-001 v1.0 (ver docs/PHASE_5_COMPATIBILITY_HARDENING.md). No se agrega aqui a
      # proposito, para que el SQL Static Validator siga rechazando cualquier futura referencia.

  V$ACTIVE_INSTANCES:
    min_version: "11.2"     # V$ACTIVE_INSTANCES en sí certificada desde 11gR2 en este catálogo
    columns:
      inst_number:         {min_version: "11.2"}
      inst_name:            {min_version: "11.2"}
      con_id:                 {min_version: "12.1"}      # BUG CORREGIDO: usado sin guardia en Q-DISC-RAC-001 v1.0

  V$PARAMETER:
    min_version: all
    columns: {name: {min_version: all}, value: {min_version: all}, isdefault: {min_version: all}, ismodified: {min_version: all}}

  GV$PARAMETER:
    min_version: all

  V$SPPARAMETER:
    min_version: all

  V$CONTROLFILE:
    min_version: all

  V$CONTROLFILE_RECORD_SECTION:
    min_version: all

  V$LOG:
    min_version: all

  V$LOGFILE:
    min_version: all

  V$LOG_HISTORY:
    min_version: all

  V$ARCHIVE_DEST:
    min_version: all
    columns_exhaustive: true
    columns:
      dest_id:       {min_version: all}
      dest_name:      {min_version: all}
      target:          {min_version: all}
      status:           {min_version: all}
      archiver:          {min_version: all}
      transmit_mode:      {min_version: all}
      affirm:              {min_version: all}
      valid_now:            {min_version: all}

  V$ARCHIVE_DEST_STATUS:
    min_version: all
    columns_exhaustive: true
    columns:
      dest_id:       {min_version: all}
      status:          {min_version: all}
      error:            {min_version: all}
      recovery_mode:     {min_version: all}

  V$ARCHIVED_LOG:
    min_version: all
    columns_exhaustive: true
    columns:
      thread#:       {min_version: all}
      sequence#:      {min_version: all}
      applied:         {min_version: all}
      first_time:       {min_version: all}

  DBA_TABLESPACES:
    min_version: all

  DBA_DATA_FILES:
    min_version: all

  DBA_TABLESPACE_USAGE_METRICS:
    min_version: "11.0"     # BUG CORREGIDO: usado en Q-DBA-TBS-USAGE-001 sin variante real para 10g

  DBA_FREE_SPACE:
    min_version: all
    notes: "Fallback 10g para uso de tablespace, junto con DBA_DATA_FILES (ver Q-DBA-TBS-USAGE-001 variant V1)."

  DBA_TEMP_FILES:
    min_version: all

  DBA_TEMP_FREE_SPACE:
    min_version: all

  V$TEMP_SPACE_HEADER:
    min_version: all
    notes: "No usado por el catálogo actual; registrado por completitud del inventario (sección 15 del prompt de hardening)."

  V$UNDOSTAT:
    min_version: all

  DBA_UNDO_EXTENTS:
    min_version: all
    notes: "No usado por el catálogo actual (oracle/undo usa V$UNDOSTAT); registrado por completitud."

  V$SESSION:
    min_version: all
    columns:
      status: {min_version: all}
      type: {min_version: all}
      blocking_session: {min_version: all}
      last_call_et: {min_version: all}
      con_id: {min_version: "12.1"}
      sql_id: {min_version: all, note: "prohibido por policies/data-minimization-policy.md, no por versión"}

  V$PROCESS:
    min_version: all

  V$RESOURCE_LIMIT:
    min_version: all

  DBA_OBJECTS:
    min_version: all
    columns: {owner: {min_version: all}, object_type: {min_version: all}, status: {min_version: all}, object_name: {min_version: all}}

  CDB_OBJECTS:
    min_version: "12.1"
    notes: "No usado por defecto en Fase 2 (ver Q-ORA-OBJECTS-INVENTORY-001); documentado como alternativa cross-PDB."

  DBA_REGISTRY:
    min_version: all

  CDB_REGISTRY:
    min_version: "12.1"

  DBA_SCHEDULER_JOBS:
    min_version: all

  DBA_SCHEDULER_JOB_RUN_DETAILS:
    min_version: all

  DBA_JOBS:
    min_version: all
    notes: "Legacy DBMS_JOB. Declarado en objects_accessed de Q-ORA-JOBS-SUMMARY-001 pero NO consultado por su SQL actual — gap corregido en este hardening (ver docs/PHASE_2_COMPATIBILITY_HARDENING.md#other-query-fixes); consulta separada queda PLANNED, no se inventa un SELECT ficticio."

  V$DIAG_INFO:
    min_version: "11.0"

  DBA_OUTSTANDING_ALERTS:
    min_version: "11.0"

  V$ACTIVE_SESSION_HISTORY:
    min_version: all
    notes: "Requiere Diagnostics Pack (license gate, no version gate) — ver Q-PERF-WAIT-ASH-001, fuera del alcance Oracle Core."

  V$ASM_DISKGROUP:
    min_version: all
    notes: "cost_class endurecido en este hardening — puede disparar disk discovery; usar V$ASM_DISKGROUP_STAT para monitoreo rutinario (ver Q-DISC-ASM-001)."

  V$ASM_DISKGROUP_STAT:
    min_version: "11.0"
    notes: "Variante de bajo costo de V$ASM_DISKGROUP para polling rutinario — no dispara disk discovery."

  GV$SESSION:
    min_version: all
    notes: "Misma disponibilidad de columnas que V$SESSION, una fila por sesión por instancia visible. Usada por Q-RAC-SESSION-DIST-001 (columnas inst_id, service_name, type, status — todas 'all')."

  GV$SERVICES:
    min_version: all
    notes: "Usada por Q-RAC-SESSION-DIST-001 vía join implícito de service_name en GV$SESSION; Q-RAC-SESSION-DIST-001 certifica desde 11gR2 por política de soporte RAC (ver Notes by version en el archivo), no por disponibilidad de la vista."

  DBA_HIST_SNAPSHOT:
    min_version: "10.1"
    notes: "AWR (Diagnostics Pack). Usada por Q-PERF-WAIT-AWR-001 para acotar snap_id/end_interval_time de la ventana."

  DBA_HIST_SYSTEM_EVENT:
    min_version: "10.1"
    columns:
      time_waited_micro_fg: {min_version: "11.0", notes: "Columna foreground (FG) introducida en 11g; en 10g sólo existe time_waited_micro (sin split FG/BG). No incluida en RISKY_COLUMNS del SQL Static Validator — gap conocido, ver docs/PHASE_2_COMPATIBILITY_HARDENING.md#limitations."}
    notes: "AWR (Diagnostics Pack). Usada por Q-PERF-WAIT-AWR-001."

  DBA_HIST_ACTIVE_SESS_HISTORY:
    min_version: "10.1"
    notes: "AWR (Diagnostics Pack), ASH histórico persistido en cada snapshot. Usada por Q-PERF-WAIT-ASH-001 como fallback documentado a V$ACTIVE_SESSION_HISTORY."

  # --- Fase 3 (Oracle Performance) ---

  STATS$SYSTEM_EVENT:
    min_version: all
    notes: "Statspack (paquete instalado manualmente, sin licenciamiento adicional). Usada por Q-PERF-WAIT-STATSPACK-001."

  STATS$SNAPSHOT:
    min_version: all
    notes: "Statspack. Usada por Q-PERF-WAIT-STATSPACK-001 para acotar snap_id/snap_time de la ventana."

  DBA_HIST_SYS_TIME_MODEL:
    min_version: "10.1"
    notes: "AWR (Diagnostics Pack). Usada por Q-PERF-DBTIME-001 (DB Time/DB CPU históricos)."

  V$SYS_TIME_MODEL:
    min_version: all
    notes: "Sin licenciamiento adicional. Usada por Q-PERF-DBTIME-CURRENT-001, ruta estándar de DB Time/DB CPU."

  DBA_HIST_SQLSTAT:
    min_version: "10.1"
    notes: "AWR (Diagnostics Pack). Usada por Q-PERF-TOPSQL-001 y Q-PERF-PLAN-HIST-001."

  V$SQLSTATS:
    min_version: all
    notes: "Sin licenciamiento adicional. Usada por Q-PERF-TOPSQL-CURRENT-001, ruta estándar de top SQL."

  V$SQL_PLAN:
    min_version: all
    notes: "Usada por Q-PERF-PLAN-001 (plan actual en shared pool)."

  DBA_HIST_SQL_PLAN:
    min_version: "10.1"
    notes: "AWR (Diagnostics Pack). Registrada por completitud del inventario de Fase 3 — Q-PERF-PLAN-HIST-001 obtiene el historial de plan_hash_value vía DBA_HIST_SQLSTAT, no consulta el texto del plan histórico directamente."

  V$SGA:
    min_version: all
    notes: "Usada por Q-PERF-SGA-001."

  V$SGAINFO:
    min_version: all
    notes: "Usada por Q-PERF-SGA-001."

  V$SGASTAT:
    min_version: all
    notes: "Usada por Q-PERF-SGA-001 y Q-PERF-SHAREDPOOL-001."

  V$PGASTAT:
    min_version: all
    columns:
      pga_aggregate_limit_row: {min_version: "12.1", notes: "No existe como fila de V$PGASTAT en ninguna versión — PGA_AGGREGATE_LIMIT es un PARAMETER (12.1+), leído vía V$PARAMETER por el skill, nunca vía esta vista. Entrada documental, no una columna real de V$PGASTAT — ver Q-PERF-PGA-001."}
    notes: "Usada por Q-PERF-PGA-001. Filtrado por columna 'name' (string), no por nombre de columna SQL — una fila ausente en una versión no produce error, sólo NULL (ver docs/QUERY_VARIANTS.md)."

  V$SYSSTAT:
    min_version: all
    notes: "Usada por Q-PERF-HARDPARSE-001 y Q-PERF-REDO-001. Filtrado por columna 'name' (string) — mismo patrón seguro que V$PGASTAT."

  V$LIBRARYCACHE:
    min_version: all
    notes: "Usada por Q-PERF-LIBCACHE-001."

  V$ROWCACHE:
    min_version: all
    notes: "Usada por Q-PERF-SHAREDPOOL-001 (dictionary cache hit ratio)."

  V$SYSTEM_EVENT:
    min_version: all
    notes: "Usada por Q-PERF-IO-001 (snapshot actual, sin licenciamiento — distinto de DBA_HIST_SYSTEM_EVENT)."

  V$FILESTAT:
    min_version: all
    notes: "Usada por Q-PERF-IO-FILESTAT-001."

  V$DATAFILE:
    min_version: all
    notes: "Usada por Q-PERF-IO-FILESTAT-001 (join con V$FILESTAT para nombre de archivo)."

  V$SORT_USAGE:
    min_version: all
    notes: "Usada por Q-PERF-TEMP-001 (uso activo de TEMP por sesión)."

  V$LOCK:
    min_version: all
    notes: "Usada por Q-PERF-LOCKS-001."

  V$PX_SESSION:
    min_version: all
    notes: "Usada por Q-PERF-PARALLEL-001."

  V$PQ_SYSSTAT:
    min_version: all
    notes: "Registrada por completitud del inventario de Fase 3 — no consultada por ninguna query certificada activa todavía; candidata para Q-PERF-PARALLEL-STAT-001 vía /change query futuro (ver Q-PERF-PARALLEL-001)."

  # --- Fase 4 (RAC/GI/ASM/Network) ---

  GV$ACTIVE_SERVICES:
    min_version: "11.2"
    notes: "Usada por Q-RAC-SERVICES-001 junto con GV$SERVICES para distinguir configurado vs. activo."

  GV$SERVICES:
    min_version: all
    notes: "Mismas columnas relevantes (clb_goal/goal) desde 10g; combinada con GV$ACTIVE_SERVICES (11.2+) para placement actual. Usada por Q-RAC-SERVICES-001."

  GV$GES_STATISTICS:
    min_version: "11.2"
    notes: "Usada por Q-RAC-GES-GCS-001 (rac/global-cache)."

  GV$GCS_STATISTICS:
    min_version: "11.2"
    notes: "Usada por Q-RAC-GES-GCS-001 (rac/global-cache)."

  GV$INSTANCE_CACHE_TRANSFER:
    min_version: "11.2"
    notes: "Usada por Q-RAC-GES-GCS-001 — detalle de transferencia de bloques por instancia."

  GV$CLUSTER_INTERCONNECTS:
    min_version: "11.2"
    notes: "Usada por Q-RAC-INTERCONNECT-001 (rac/interconnect)."

  V$ACTIVE_INSTANCES:
    min_version: "11.2"
    notes: "Ya registrada arriba — reutilizada por Q-RAC-TOPOLOGY-001 junto con GV$INSTANCE."

  GV$ASM_INSTANCE:
    min_version: "11.2"
    notes: "Usada por Q-ASM-TOPOLOGY-001 (asm/topology, asm/instances)."

  V$ASM_DISK:
    min_version: "11.2"
    columns:
      mount_status: {min_version: "11.2"}
      header_status: {min_version: "11.2"}
      mode_status: {min_version: "11.2"}
      state: {min_version: "11.2"}
      failgroup: {min_version: "11.2"}
      path: {min_version: "11.2"}
      read_errs: {min_version: "11.2"}
      write_errs: {min_version: "11.2"}
    notes: "Usada por Q-ASM-DISKS-001 (asm/disks, asm/failure-groups) — cost_class MEDIUM, no se usa para polling de capacidad rutinario (eso es V$ASM_DISKGROUP_STAT)."

  V$ASM_OPERATION:
    min_version: "11.2"
    notes: "Usada por Q-ASM-REBALANCE-001 (asm/rebalance, asm/operations)."

  GV$ASM_OPERATION:
    min_version: "11.2"
    notes: "Variante multi-instancia de V$ASM_OPERATION para RAC — misma columnas."

  # --- Fase 5 (Data Guard) ---

  V$DATAGUARD_STATS:
    min_version: all
    columns_exhaustive: true
    columns:
      transport_lag: {min_version: "11.0"}
      apply_lag: {min_version: "11.0"}
      name: {min_version: all}
      value: {min_version: all}
      unit: {min_version: all}
    notes: "Vista disponible desde 10g; columnas TRANSPORT_LAG/APPLY_LAG con nombre estable desde 11g (en 10g la métrica equivalente se lee de la columna genérica NAME/VALUE). Usada por Q-DG-STATS-001 (dataguard/lag)."

  V$DATAGUARD_STATUS:
    min_version: all
    notes: "Registrada por completitud del inventario (# 8 del prompt de Fase 5) — no consultada directamente por ninguna query certificada activa; su contenido (mensajes de estado Data Guard) se cubre de forma más estructurada vía Broker DGMGRL (dataguard/broker), no vía esta vista de texto libre."

  V$MANAGED_STANDBY:
    min_version: all
    columns_exhaustive: true
    columns:
      process:         {min_version: all}
      pid:              {min_version: all}
      status:            {min_version: all}
      client_process:     {min_version: all}
      client_pid:          {min_version: all}
      thread#:              {min_version: all}
      sequence#:             {min_version: all}
      block#:                 {min_version: all}
      blocks:                  {min_version: all}
    validation:
      source_type: ORACLE_DOCUMENTATION
      status: DOCUMENTATION_VALIDATED
      validated_for: ["10.2", "11.2", "12.1", "12.2", "18", "19", "21", "23"]
    notes: >
      PHASE 5 — DATA GUARD FINAL PROCESS-VIEW & PORTABILITY HARDENING (# 4, # 8, # 13 del prompt):
      metadata corregida contra la documentación oficial de Oracle Database Reference — columnas
      reales verificadas: PROCESS, PID, STATUS, CLIENT_PROCESS, CLIENT_PID, CLIENT_DBID, GROUP#,
      RESETLOG_ID, THREAD#, SEQUENCE#, BLOCK#, BLOCKS, DELAY_MINS, KNOWN_AGENTS, ACTIVE_AGENTS,
      CON_ID (sólo se registran aquí las usadas por Q-DG-MANAGED-PROCESS-001 variante legacy).
      **Deprecada oficialmente desde Oracle Database 12.2.0.1** — Oracle recomienda V$DATAGUARD_PROCESS
      en su lugar. Se retiene como legacy únicamente para 10.2–12.1 (Q-DG-MANAGED-PROCESS-001 variante
      legacy) — nunca como default universal permanente para versiones donde la vista moderna ya
      está disponible (# 8: no usar la vista deprecated como universal permanent default).

  GV$MANAGED_STANDBY:
    min_version: "11.2"
    notes: >
      Variante multi-instancia de V$MANAGED_STANDBY para RAC — mismas columnas + INST_ID (regla
      general de vistas GV$ documentada en Oracle Database Reference / RAC Administration). Usada
      por Q-DG-MANAGED-PROCESS-001 variante legacy cuando el sitio consultado es RAC. Igual que su
      contraparte V$, deprecada desde 12.2.0.1 en favor de GV$DATAGUARD_PROCESS.

  V$DATAGUARD_PROCESS:
    min_version: "12.2"
    columns_exhaustive: true
    columns:
      name:              {min_version: "12.2"}
      pid:                {min_version: "12.2"}
      type:                {min_version: "12.2"}
      role:                 {min_version: "12.2"}
      action:                {min_version: "12.2"}
      client_pid:             {min_version: "12.2"}
      client_role:             {min_version: "12.2"}
      thread#:                  {min_version: "12.2"}
      sequence#:                 {min_version: "12.2"}
      block#:                     {min_version: "12.2"}
      block_count:                 {min_version: "12.2"}
    validation:
      source_type: ORACLE_DOCUMENTATION
      status: DOCUMENTATION_VALIDATED
      validated_for: ["12.2", "18", "19", "21", "23"]
    notes: >
      PHASE 5 — DATA GUARD FINAL PROCESS-VIEW & PORTABILITY HARDENING (# 4, # 13 del prompt):
      metadata corregida contra la documentación oficial de Oracle Database Reference —
      **min_version real es 12.2.0.1** (Oracle Database 12c Release 2), NO 11.2 como se declaró
      incorrectamente en el hardening anterior (defecto real corregido, ver
      docs/PHASE_5_FINAL_PROCESS_VIEW_PORTABILITY_HARDENING.md). STATUS y CLIENT_PROCESS NO son
      columnas de esta vista (esas pertenecen a V$MANAGED_STANDBY) — eliminadas del registro; las
      columnas reales son NAME, PID, TYPE, ROLE, PROC_TIME, TASK_TIME, TASK_DONE, ACTION, CLIENT_PID,
      CLIENT_ROLE, GROUP#, RESETLOG_ID, THREAD#, SEQUENCE#, BLOCK#, BLOCK_COUNT, DELAY_MINS, DEST_ID,
      DEST_MASK, DBID, DGID, INSTANCE, STOP_STATE, CON_ID (sólo se registran aquí las usadas por
      Q-DG-MANAGED-PROCESS-001 variante moderna). A diferencia de lo asumido antes, SÍ expone
      THREAD#/SEQUENCE#/BLOCK# — el modelo lógico común ya no necesita marcar esos campos
      PARTIALLY_SUPPORTED en la variante moderna; sólo PROCESS_ROLE queda sin equivalente en la
      variante legacy (V$MANAGED_STANDBY no tiene columna ROLE). Oracle recomienda esta vista en
      lugar de la deprecada V$MANAGED_STANDBY desde 12.2.0.1.

  GV$DATAGUARD_PROCESS:
    min_version: "12.2"
    notes: >
      Variante multi-instancia de V$DATAGUARD_PROCESS para RAC — mismas columnas + INST_ID. No se
      encontró una página de referencia Oracle dedicada a esta vista específica durante la
      verificación documental de este hardening; se registra con base en la regla arquitectónica
      general y documentada de Oracle para vistas GV$ (toda V$ fija tiene una contraparte GV$ con
      INST_ID adicional — Oracle Database Reference, "GV$ Views"), no en una página GV$-específica
      confirmada. Usada por Q-DG-MANAGED-PROCESS-001 variante moderna cuando el sitio consultado es
      RAC. validation.status: DOCUMENTATION_VALIDATED por regla general, no por página dedicada.

  V$RECOVERY_PROGRESS:
    min_version: all
    notes: "Registrada por completitud del inventario (# 8) — no usada por el catálogo certificado actual; candidata para una futura Q-DG-RECOVERY-PROGRESS-001 vía /change query si se requiere progreso detallado de recovery más allá de V$MANAGED_STANDBY."

  V$STANDBY_LOG:
    min_version: all
    columns_exhaustive: true
    columns:
      thread#: {min_version: all}
      groups: {min_version: all}
      status: {min_version: all}
      bytes: {min_version: all}
    notes: "Usada por Q-DG-SRL-001 (dataguard/standby-redo-logs), junto con V$LOG (ya registrada) para comparar contra online redo del primary."

  V$ARCHIVE_GAP:
    min_version: all
    columns_exhaustive: true
    columns:
      thread#:          {min_version: all}
      low_sequence#:     {min_version: all}
      high_sequence#:     {min_version: all}
    notes: "Usada por Q-DG-ARCHIVE-GAP-001 (dataguard/archive-gaps), relocalizada a queries/dataguard/ en Fase 5. Columnas THREAD#/LOW_SEQUENCE#/HIGH_SEQUENCE# estables desde 10g."

  GV$ARCHIVE_DEST_STATUS:
    min_version: all
    notes: "Variante multi-instancia de V$ARCHIVE_DEST_STATUS (ya registrada) para RAC — usada por Q-DG-DEST-001 cuando el primary es RAC."

  # --- Fase 6 (Multitenant / CDB / PDB) ---
  # Vistas verificadas contra Oracle Database Reference (WebFetch, no circular) durante esta fase
  # están marcadas columns_exhaustive:true + validation: (mismo criterio establecido en Fase 5
  # Compatibility/Final Hardening). Las que se registran por convención documentada sin fetch
  # dedicado quedan sin ese flag — el SQL Static Validator las trata permisivamente.

  V$PDBS:
    min_version: "12.1"
    columns_exhaustive: true
    columns:
      con_id:              {min_version: "12.1"}
      name:                 {min_version: "12.1"}
      open_mode:             {min_version: "12.1"}
      restricted:             {min_version: "12.1"}
      open_time:               {min_version: "12.1"}
      total_size:               {min_version: "12.1"}
      recovery_status:           {min_version: "12.1"}
      application_root:           {min_version: "12.2"}
      application_pdb:              {min_version: "12.2"}
      application_seed:               {min_version: "12.2"}
      proxy_pdb:                        {min_version: "12.2"}
      local_undo:                        {min_version: "12.2"}
    validation:
      source_type: ORACLE_DOCUMENTATION
      status: DOCUMENTATION_VALIDATED
      validated_for: ["12.1", "12.2", "18", "19", "21", "23"]
    notes: >
      Fase 6. Vista central de inventario de PDB, verificada contra Oracle Database Reference 19c.
      APPLICATION_ROOT/APPLICATION_PDB/APPLICATION_SEED/PROXY_PDB/LOCAL_UNDO introducidas en 12.2
      (Application Containers y Local Undo no existen en 12.1 — # 5, # 19 del prompt de Fase 6).
      Usada por Q-CDB-PDB-STATE-001.

  V$CONTAINERS:
    min_version: "12.1"
    columns_exhaustive: true
    columns:
      con_id: {min_version: "12.1"}
      name:    {min_version: "12.1"}
      open_mode: {min_version: "12.1"}
    validation:
      source_type: ORACLE_DOCUMENTATION
      status: DOCUMENTATION_VALIDATED
      validated_for: ["12.1", "12.2", "18", "19", "21", "23"]
    notes: >
      Fase 6. Superset de V$PDBS que además incluye CDB$ROOT (con_id=1) — verificado contra Oracle
      Database Reference 19c (31 columnas totales; sólo se registran/certifican aquí con_id/name/
      open_mode, las usadas por Q-CDB-CONTAINERS-001). Usada para topología general, no para el
      inventario detallado de PDB (eso lo cubre V$PDBS). Bloque validation: agregado en PHASE 6 —
      QUERY COMPATIBILITY & DICTIONARY CERTIFICATION HARDENING (# 23-24) — la vista ya estaba
      verificada en la construcción base de Fase 6, pero el bloque de trazabilidad no se había
      declarado explícitamente.

  # CDB_PDB_SAVED_STATES eliminada (PHASE 6 — QUERY COMPATIBILITY & DICTIONARY CERTIFICATION
  # HARDENING, # 4-8 del prompt): no es una vista real de Oracle — WebFetch contra
  # https://docs.oracle.com/en/database/oracle/oracle-database/19/refrn/CDB_PDB_SAVED_STATES.html
  # devuelve HTTP 404. La vista real, verificada, es DBA_PDB_SAVED_STATES (abajo). Registrada
  # aquí sin respaldo documental en la construcción base de Fase 6 — corregido en este hardening.
  DBA_PDB_SAVED_STATES:
    min_version: "12.1.0.2"
    columns_exhaustive: true
    columns:
      con_id:        {min_version: "12.1.0.2"}
      con_name:       {min_version: "12.1.0.2"}
      instance_name:   {min_version: "12.1.0.2"}
      con_uid:          {min_version: "12.1.0.2"}
      guid:              {min_version: "12.1.0.2"}
      state:              {min_version: "12.1.0.2"}
      restricted:          {min_version: "12.1.0.2"}
    validation:
      source_type: ORACLE_DOCUMENTATION
      status: DOCUMENTATION_VALIDATED
      validated_for: ["12.1.0.2", "12.2", "18", "19", "21", "23"]
    notes: >
      Fase 6 Hardening. Verificada contra Oracle Database Reference 19c
      (docs.oracle.com/en/database/oracle/oracle-database/19/refrn/DBA_PDB_SAVED_STATES.html) —
      7 columnas confirmadas (CON_ID, CON_NAME, INSTANCE_NAME, CON_UID, GUID, STATE, RESTRICTED).
      Es un data link — visible también desde dentro de la PDB, aunque esta query sólo la consulta
      desde CDB$ROOT. PDB Saved State (la feature, no sólo la vista) requiere patch level 12.1.0.2
      — no existe en 12.1.0.0/12.1.0.1 (corroborado por múltiples fuentes técnicas independientes;
      no hay una nota "New Features" de docs.oracle.com indexada que lo confirme con URL propia,
      documentado como limitación de trazabilidad, no como hecho no verificado — # 6 del prompt).
      Usada por Q-CDB-PDB-SAVED-STATE-001 — sólo visibilidad, nunca SAVE STATE/DISCARD STATE
      (# 12 del prompt de Fase 6 base).

  CDB_TABLESPACE_USAGE_METRICS:
    min_version: "12.1"
    notes: "Fase 6. Mirror de DBA_TABLESPACE_USAGE_METRICS (ya certificada en Oracle Core) + con_id. Registrada por convención documentada de vistas CDB_*, sin fetch dedicado — permisiva para el SQL Static Validator. Usada por Q-CDB-TABLESPACES-001."

  CDB_TABLESPACES:
    min_version: "12.1"
    notes: "Fase 6. Mirror de DBA_TABLESPACES + con_id. Usada por Q-CDB-TABLESPACES-001 (columna contents para distinguir PERMANENT/TEMPORARY/UNDO)."

  CDB_DATA_FILES:
    min_version: "12.1"
    notes: "Fase 6. Mirror de DBA_DATA_FILES (ya certificada en Oracle Core) + con_id. Usada por Q-CDB-TABLESPACES-001."

  CDB_TEMP_FILES:
    min_version: "12.1"
    notes: "Fase 6. Mirror de DBA_TEMP_FILES (ya certificada en Oracle Core) + con_id. Usada por Q-CDB-TEMP-001."

  GV$TEMP_SPACE_HEADER:
    min_version: "12.1"
    notes: "Fase 6. Variante multi-instancia/multitenant de V$TEMP_SPACE_HEADER (ya registrada) con con_id. Usada por Q-CDB-TEMP-001."

  GV$SYSTEM_PARAMETER:
    min_version: "12.1"
    notes: "Fase 6. Variante multi-instancia de V$SYSTEM_PARAMETER con con_id/ispdb_modifiable (multitenant-aware desde 12.1). Usada por Q-CDB-PARAMETERS-001."

  CDB_USERS:
    min_version: "12.1"
    notes: "Fase 6. Mirror de DBA_USERS + con_id/common/oracle_maintained. Usada por Q-CDB-USERS-001 — sólo visibilidad, nunca password hashes (# 23 del prompt de Fase 6)."

  CDB_ROLES:
    min_version: "12.1"
    notes: "Fase 6. Mirror de DBA_ROLES + con_id/common/oracle_maintained. Usada por Q-CDB-ROLES-001."

  PDB_PLUG_IN_VIOLATIONS:
    min_version: "12.1"
    columns_exhaustive: true
    columns:
      time:             {min_version: "12.1"}
      name:              {min_version: "12.1"}
      cause:              {min_version: "12.1"}
      type:                {min_version: "12.1"}
      error_number:         {min_version: "12.1"}
      line:                  {min_version: "12.1"}
      message:                {min_version: "12.1"}
      status:                  {min_version: "12.1"}
      action:                   {min_version: "12.1"}
      con_id:          {min_version: "12.2"}
    validation:
      source_type: ORACLE_DOCUMENTATION
      status: DOCUMENTATION_VALIDATED
      validated_for: ["12.1", "12.2", "18", "19", "21", "23"]
    notes: >
      Fase 6 Hardening. CORRECCIÓN: con_id se registraba con min_version "12.1" en la construcción
      base de Fase 6 — verificado directamente contra las referencias 12.1 (docs.oracle.com/database
      /121/REFRN/GUID-845E5369-CCB0-4F8D-AE09-447EF0CAC93F.htm, 9 columnas, SIN con_id) y 12.2
      (docs.oracle.com/en/database/oracle/oracle-database/12.2/refrn/PDB_PLUG_IN_VIOLATIONS.html,
      10 columnas, CON con_id): con_id no existe en 12.1, se agrega en 12.2. Q-CDB-PLUGIN-VIOLATIONS-001
      usa dos variantes (legacy 12.1 sin con_id / modern 12.2+ con con_id) reflejando exactamente este
      boundary — nunca se selecciona con_id en la variante legacy (# 15-19 del prompt de hardening
      de compatibilidad). CORRECCIÓN 2 (PHASE 6 — FINAL PDB IDENTITY & PATCH-LEVEL RESOLVER
      HARDENING): la nota anterior afirmaba "no tiene columna de nombre de PDB propia" — incorrecto.
      NAME sí es identidad de PDB: verificado (WebFetch, ambas referencias 12.1 y 19c) — descripción
      textual de Oracle: "The name of an existing PDB or a PDB intended to be created (if a row was
      entered as a result of running DBMS_PDB.CHECK_PLUG_COMPATIBILITY)". El skill deriva
      container_name/pdb_token de NAME (sanitizado) en la variante legacy (container_id sigue
      NOT_AVAILABLE, sin con_id no hay forma de correlacionar contra V$PDBS por con_id); en la
      variante moderna correlaciona con_id (vía V$PDBS) Y name, publicando IDENTITY_MISMATCH si no
      coinciden — nunca oculta la inconsistencia. MESSAGE/ACTION siempre tratados como DATA (# 26,
      # 48 del prompt de Fase 6 base; # 20/# 8 de los hardenings posteriores). Usada por
      Q-CDB-PLUGIN-VIOLATIONS-001.

  V$RSRCPDBMETRIC:
    min_version: "12.2"
    columns_exhaustive: true
    columns:
      con_id:                         {min_version: "12.2"}
      cpu_consumed_time:                {min_version: "12.2"}
      cpu_wait_time:                      {min_version: "12.2"}
      num_cpus:                            {min_version: "12.2"}
      cpu_utilization_limit:                 {min_version: "12.2"}
      avg_cpu_utilization:                     {min_version: "12.2"}
      avg_running_sessions:                      {min_version: "12.2"}
      avg_waiting_sessions:                        {min_version: "12.2"}
      running_sessions_limit:                        {min_version: "12.2"}
      avg_active_parallel_servers:                     {min_version: "12.2"}
      avg_queued_parallel_servers:                   {min_version: "12.2"}
      parallel_servers_limit:                      {min_version: "12.2"}
      sga_bytes:                                 {min_version: "12.2"}
      pga_bytes:                                {min_version: "12.2"}
      iops:                                    {min_version: "12.2"}
      iombps:                                {min_version: "12.2"}
      plan_name:                            {min_version: "12.2"}
    validation:
      source_type: ORACLE_DOCUMENTATION
      status: DOCUMENTATION_VALIDATED
      validated_for: ["12.2", "18", "19", "21", "23"]
    notes: >
      Fase 6 Hardening. CORRECCIÓN: registrada con min_version "12.1" en la construcción base de
      Fase 6 — verificado directamente contra docs.oracle.com/en/database/oracle/oracle-database/
      12.2/refrn/V-RSRCPDBMETRIC.html, que declara explícitamente "introduced in Oracle Database
      12c Release 2 (12.2.0.1)". La vista NO existe en 12.1 — ninguna fuente equivalente certificada
      de métricas de recursos por PDB existe para 12.1 (no se inventa una alternativa, # 11 del
      prompt de hardening); en 12.1, PDB Resource Metrics degrada explícitamente a
      capability_status: PARTIALLY_SUPPORTED (ver skills/multitenant/resource-usage/SKILL.md,
      config/capability-matrix.yaml). Todas las 17 columnas seleccionadas por
      Q-CDB-RESOURCE-USAGE-001 confirmadas reales en la referencia 12.2. Licensing-safe — no
      requiere Diagnostics/Tuning Pack (# 30 del prompt de Fase 6 base).

  DBA_CDB_RSRC_PLAN_DIRECTIVES:
    min_version: "12.1"
    columns_exhaustive: true
    columns:
      plan:                 {min_version: "12.1"}
      pluggable_database:     {min_version: "12.1"}
      shares:                   {min_version: "12.1"}
      utilization_limit:         {min_version: "12.1"}
      parallel_server_limit:       {min_version: "12.1"}
    validation:
      source_type: ORACLE_DOCUMENTATION
      status: DOCUMENTATION_VALIDATED
      validated_for: ["12.1", "12.2", "18", "19", "21", "23"]
    notes: >
      Fase 6. Nombre real verificado contra Oracle Database Reference — NO es "CDB_RSRC_PLAN_
      DIRECTIVES" como aparece en el ejemplo conceptual del prompt de Fase 6 (# 8); ese nombre no
      corresponde a ninguna vista real. DBA_RSRC_PLAN_DIRECTIVES (sin CDB) es la vista legacy de
      consumer groups intra-instancia, un objeto distinto. Usada por Q-CDB-RESOURCE-MANAGER-001.

  CDB_LOCKDOWN_PROFILES:
    min_version: "12.2"
    columns_exhaustive: true
    columns:
      con_id:            {min_version: "12.2"}
      profile_name:        {min_version: "12.2"}
      rule_type:             {min_version: "12.2"}
      rule:                    {min_version: "12.2"}
      clause:                    {min_version: "12.2"}
      clause_option:                {min_version: "12.2"}
      status:                         {min_version: "12.2"}
    validation:
      source_type: ORACLE_DOCUMENTATION
      status: DOCUMENTATION_VALIDATED
      validated_for: ["12.2", "18", "19", "21", "23"]
    notes: "Fase 6. Verificada contra Oracle Database Reference 19c. Lockdown Profiles introducidos en 12.2 — no existen en 12.1. Usada por Q-CDB-LOCKDOWN-001 — sólo visibilidad, nunca ALTER LOCKDOWN PROFILE (# 32 del prompt)."
